<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="17" r="2.2"></circle>
        <circle cx="12" cy="7" r="2.2"></circle>
        <circle cx="19" cy="17" r="2.2"></circle>
        <path d="M6.9 15.7L10.1 8.9"></path>
        <path d="M13.9 8.9L17.1 15.7"></path>
      </svg>
      <span class="sidebar__brand-name">n8n Admin</span>
    </div>

    <a routerLink="/flows" class="back-to-hub">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M11 18l-6-6 6-6"></path>
      </svg>
      <span>{{ 'nav.backToHub' | translate }}</span>
    </a>

    <nav class="sidebar__nav">
      <a routerLink="/jobs" routerLinkActive="nav-item--active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path>
          <path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path>
        </svg>
        <span>{{ 'nav.allJobs' | translate }}</span>
      </a>

      <a routerLink="/jobs/new" routerLinkActive="nav-item--active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path>
        </svg>
        <span>{{ 'nav.addJob' | translate }}</span>
      </a>

      <a routerLink="/rule-sets" routerLinkActive="nav-item--active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16"></path><path d="M7.5 12h9"></path><path d="M10.5 18h3"></path>
        </svg>
        <span>{{ 'nav.ruleSets' | translate }}</span>
      </a>

      <a routerLink="/users" routerLinkActive="nav-item--active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3"></circle>
          <path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path>
          <path d="M16.3 8.5a2.5 2.5 0 1 0-.8-4.9"></path>
          <path d="M19.5 19c0-2.3-1.5-4.2-3.6-4.8"></path>
        </svg>
        <span>{{ 'nav.users' | translate }}</span>
      </a>

      <a routerLink="/prompts" routerLinkActive="nav-item--active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3v5h5"></path>
          <path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"></path>
          <path d="M8.5 13.5h7"></path><path d="M8.5 17h7"></path>
        </svg>
        <span>{{ 'nav.prompts' | translate }}</span>
      </a>

      <a routerLink="/glossary" routerLinkActive="nav-item--active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9s1.3-6.5 3.8-9Z"></path>
        </svg>
        <span>{{ 'nav.glossary' | translate }}</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <app-language-switcher />

      <button type="button" class="logout-item" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
        <span>{{ 'nav.logout' | translate }}</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
