@if (totalPages() > 1) {
  <div class="paginator">
    <button
      type="button"
      class="icon-btn"
      [disabled]="page() <= 1"
      (click)="goPrev()"
      [attr.aria-label]="'common.pagination.prev' | translate"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>

    <span class="paginator__label">{{ 'common.pagination.pageOf' | translate: { page: page(), total: totalPages() } }}</span>

    <button
      type="button"
      class="icon-btn"
      [disabled]="page() >= totalPages()"
      (click)="goNext()"
      [attr.aria-label]="'common.pagination.next' | translate"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"></path>
      </svg>
    </button>
  </div>
}
